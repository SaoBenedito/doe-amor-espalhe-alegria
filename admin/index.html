<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel interno • Doe Amor</title><link rel="icon" href="../logo-doe-amor.png"><link rel="stylesheet" href="admin.css"></head>
<body><header><img src="../logo-doe-amor.png" alt=""><div><strong>Doe Amor, Espalhe Alegria</strong><small>Administração interna</small></div><button id="logout" hidden>Sair</button></header>
<main><section id="login"><h1>Acesso administrativo</h1><p>Somente pessoas autorizadas podem acessar o painel.</p><form id="loginForm"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><label class="checkline"><input id="showPassword" type="checkbox"> Mostrar senha</label><label class="checkline"><input id="remember" type="checkbox"> Manter conectado neste dispositivo</label><button type="submit">Entrar</button><p><button id="forgotPassword" class="textbutton" type="button">Esqueci minha senha</button></p></form></section>
<section id="dashboard" hidden><h1>Painel de controle</h1><p id="role"></p><nav id="modules"></nav><div id="content" aria-live="polite"></div></section><p id="status" role="status"></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="publications.js"></script><script src="volunteers.js"></script><script src="infinitepay.js"></script><script src="expenditures.js"></script><script src="records.js"></script><script src="admin.js"></script></body></html>
