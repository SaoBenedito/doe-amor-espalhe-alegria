<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ativar acesso • Doe Amor</title><link rel="stylesheet" href="admin.css"></head>
<body><header><strong>Doe Amor, Espalhe Alegria • Ativação de acesso</strong></header>
<main><section id="login"><h1>Criar senha de gestão</h1><p id="status" role="status">Verificando convite...</p><form id="form" hidden><label>Nova senha (mínimo 12 caracteres)<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirmar senha<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Ativar minha senha</button></form><p><a href="./">Voltar ao login</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
const sb=window.supabase.createClient("https://xtwydlgoqmqhbpbojwmp.supabase.co","sb_publishable_E1nafD2jTZRz3Nhx2oTtiQ_SSpW5t-4");

const $=id=>document.getElementById(id);
async function check(){
 const params=new URLSearchParams(location.search);
 if(params.has("error")){ $("status").textContent="Este convite expirou ou é inválido. Solicite um novo convite.";return; }
 if(params.has("token_hash")&&params.has("type")){
  const result=await sb.auth.verifyOtp({token_hash:params.get("token_hash"),type:params.get("type")});
  if(result.error){$("status").textContent="Não foi possível validar o convite: "+result.error.message;return;}
 }
 const {data:{user},error}=await sb.auth.getUser();
 if(error||!user){$("status").textContent="Convite inválido ou sessão expirada. Solicite um novo convite.";return;}
 let member=null,roleError=null;
 for(let attempt=0;attempt<8;attempt++){
  const result=await sb.from("admin_members").select("role,active").eq("user_id",user.id).maybeSingle();
  member=result.data;roleError=result.error;
  if(member?.active&&["owner","admin"].includes(member.role))break;
  if(attempt<7){$("status").textContent="Confirmando sua permissão administrativa...";await new Promise(resolve=>setTimeout(resolve,1500));}
 }
 if(roleError||!member?.active||!["owner","admin"].includes(member.role)){
  $("status").textContent="Não foi possível confirmar sua permissão. Peça à pessoa proprietária para verificar seu convite no painel administrativo.";
  return;
 }
 $("status").textContent="Convite validado para "+user.email+". Defina sua senha."; $("form").hidden=false;
}
$("form").addEventListener("submit",async event=>{
 event.preventDefault();
 if($("password").value!==$("confirm").value){$("status").textContent="As senhas não coincidem.";return;}
 const {error}=await sb.auth.updateUser({password:$("password").value});
 if(error){$("status").textContent="Erro ao definir senha: "+error.message;return;}
 $("form").hidden=true;history.replaceState(null,"",location.pathname);$("status").textContent="Senha criada! Agora você pode entrar no painel administrativo.";
});
check().catch(()=>{$("status").textContent="Erro ao validar convite. Tente novamente.";});
</script></body></html>
